<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Corti · Test Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:'Inter',sans-serif;background:#16110d;color:#efe7db;min-height:100vh;padding:18px 0 130px}
  .head{text-align:center;padding:0 18px}
  .brand{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700}
  .brand span{color:#c9a86a}
  .kicker{color:#9c8e7d;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-top:3px}
  .tag{display:inline-block;margin-top:10px;font-size:11px;color:#16110d;background:#c9a86a;font-weight:600;
    padding:5px 13px;border-radius:30px;letter-spacing:.5px}
  .wrap{max-width:560px;margin:18px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:9px}
  .cat{font-family:'Cormorant Garamond',serif;font-size:19px;color:#e3c789;margin:16px 4px 2px;font-weight:700}
  .item{background:#1d1712;border:1px solid #2c2218;border-radius:14px;padding:13px 14px;display:flex;
    justify-content:space-between;align-items:center;gap:12px}
  .iname{font-size:14px;font-weight:500}
  .iprice{font-size:12px;color:#9c8e7d;margin-top:2px}
  .add{background:#2a2016;border:1px solid #41331f;color:#e3c789;font-size:18px;font-weight:600;width:38px;height:38px;
    border-radius:11px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;flex:none}
  .add:active{transform:scale(.9)}
  .qty{display:flex;align-items:center;gap:11px}
  .qn{min-width:18px;text-align:center;font-weight:600}
  .minus{background:transparent;border:1px solid #41331f;color:#cbb98f;width:32px;height:32px;border-radius:9px;cursor:pointer;font-size:17px}
  .loading{text-align:center;color:#7d7060;padding:40px 0}
  .bar{position:fixed;left:0;right:0;bottom:0;background:#1a140f;border-top:1px solid #2c2218;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.4)}
  .barinfo{flex:1}
  .barn{font-size:12px;color:#9c8e7d}
  .bart{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:700;color:#e3c789}
  .place{background:#c9a86a;color:#16110d;border:none;font-weight:600;font-size:14px;padding:14px 22px;border-radius:30px;cursor:pointer;transition:.15s}
  .place:active{transform:scale(.97)}
  .place:disabled{opacity:.4}
  .ok{position:fixed;inset:0;background:rgba(10,7,5,.94);display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;z-index:50}
  .ok.show{display:flex}
  .okc{width:74px;height:74px;border-radius:50%;border:2px solid #5ad17f;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:18px}
  .okt{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700}
  .oks{color:#9c8e7d;font-size:14px;margin-top:8px;line-height:1.6;max-width:320px}
  .okno{color:#e3c789;font-weight:600}
  .vbtn{margin-top:24px;background:transparent;border:1px solid #c9a86a;color:#e3c789;padding:13px 24px;border-radius:30px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
  .vbtn2{margin-top:12px;background:transparent;border:none;color:#9c8e7d;font-size:13px;cursor:pointer;text-decoration:underline}
  .toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:#2a2016;border:1px solid #41331f;
    color:#e3c789;padding:10px 18px;border-radius:30px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <div class="head">
    <div class="brand"><span>Corti</span> Cafe</div>
    <div class="kicker">US Mobile · Order Test</div>
    <div class="tag">🧪 Test mode · orders tagged for easy deletion</div>
  </div>
  <div class="wrap" id="menu"><div class="loading">Loading live menu…</div></div>

  <div class="bar">
    <div class="barinfo"><div class="barn" id="barn">No items yet</div><div class="bart" id="bart">Rs 0</div></div>
    <button class="place" id="place" disabled onclick="place()">Place Order</button>
  </div>

  <div class="ok" id="ok">
    <div class="okc">✓</div>
    <div class="okt">Order Sent</div>
    <div class="oks">Order <span class="okno" id="okno">#—</span> just landed on the Corti POS.<br>Open the live viewer to watch it appear.</div>
    <a class="vbtn" href="viewer.html" target="_blank">Open Live POS Viewer →</a>
    <button class="vbtn2" onclick="reset()">Place another test order</button>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const BASE="https://wcerbpgpdunszudczqbu.supabase.co/rest/v1";
  const KEY="sb_publishable_wFE1gAnkLtpAhpDaDYy9kg_s2PN1HEG";
  const H={apikey:KEY,Authorization:"Bearer "+KEY,"Content-Type":"application/json"};
  const OUTLET="cba9606f-4818-4144-964c-a78fec7aaf2d";
  const STAFF="bf9908e2-75e4-44f8-b802-b59a7547d277";
  const money=n=>"Rs "+Number(n||0).toLocaleString("en-PK");
  let products=[], cart={};

  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

  async function loadMenu(){
    try{
      const r=await fetch(BASE+"/products?select=id,name,price,category_id,is_active,sort_order&is_active=eq.true&order=sort_order&limit=200",{headers:H});
      products=await r.json();
      const cats=await fetch(BASE+"/categories?select=id,name,sort_order&order=sort_order",{headers:H}).then(x=>x.json()).catch(()=>[]);
      const cmap={}; (Array.isArray(cats)?cats:[]).forEach(c=>cmap[c.id]=c.name);
      const groups={};
      products.forEach(p=>{const k=cmap[p.category_id]||"Menu";(groups[k]=groups[k]||[]).push(p);});
      const m=document.getElementById('menu'); m.innerHTML="";
      Object.keys(groups).forEach(cat=>{
        const h=document.createElement('div');h.className='cat';h.textContent=cat;m.appendChild(h);
        groups[cat].forEach(p=>m.appendChild(row(p)));
      });
    }catch(e){document.getElementById('menu').innerHTML='<div class="loading">Could not load menu. Refresh to retry.</div>';}
  }

  function row(p){
    const d=document.createElement('div');d.className='item';d.dataset.id=p.id;
    d.innerHTML='<div><div class="iname">'+p.name+'</div><div class="iprice">'+money(p.price)+'</div></div>'
      +'<div class="ctrl"></div>';
    d.querySelector('.ctrl').appendChild(ctrl(p));
    return d;
  }
  function ctrl(p){
    const c=document.createElement('div');
    const q=cart[p.id]?cart[p.id].qty:0;
    if(q>0){
      c.className='qty';
      c.innerHTML='<button class="minus">−</button><span class="qn">'+q+'</span><button class="add">+</button>';
      c.querySelector('.minus').onclick=()=>chg(p,-1);
      c.querySelector('.add').onclick=()=>chg(p,1);
    }else{
      const b=document.createElement('button');b.className='add';b.textContent='+';b.onclick=()=>chg(p,1);
      return b;
    }
    return c;
  }
  function chg(p,d){
    const cur=cart[p.id]?cart[p.id].qty:0;
    const q=Math.max(0,cur+d);
    if(q===0)delete cart[p.id];else cart[p.id]={name:p.name,price:+p.price,qty:q};
    const rowEl=document.querySelector('.item[data-id="'+p.id+'"] .ctrl');
    rowEl.innerHTML="";rowEl.appendChild(ctrl(p));
    bar();
  }
  function bar(){
    const ids=Object.keys(cart);
    const count=ids.reduce((s,k)=>s+cart[k].qty,0);
    const tot=ids.reduce((s,k)=>s+cart[k].qty*cart[k].price,0);
    document.getElementById('barn').textContent=count?count+" item"+(count>1?"s":""):"No items yet";
    document.getElementById('bart').textContent=money(tot);
    document.getElementById('place').disabled=!count;
  }

  async function place(){
    const ids=Object.keys(cart);if(!ids.length)return;
    const btn=document.getElementById('place');btn.disabled=true;btn.textContent="Sending…";
    const tot=ids.reduce((s,k)=>s+cart[k].qty*cart[k].price,0);
    const now=new Date().toISOString();
    try{
      const oRes=await fetch(BASE+"/orders",{method:"POST",headers:{...H,Prefer:"return=representation"},
        body:JSON.stringify({outlet_id:OUTLET,type:"quick",status:"open",source:"us_mobile",
          note:"TEST - US Mobile portal (safe to delete)",discount_type:"none",discount_value:0,
          subtotal:tot,tax_total:0,service_total:0,discount_total:0,total:tot,opened_by:STAFF,opened_at:now,shift_id:null})});
      const order=(await oRes.json())[0];
      if(!order||!order.id)throw new Error("order failed");
      const items=ids.map(k=>{const c=cart[k];return{order_id:order.id,product_id:k,name:c.name,qty:c.qty,
        unit_price:c.price,tax_rate:0,line_total:c.price*c.qty,voided:false,no_shot:false};});
      await fetch(BASE+"/order_items",{method:"POST",headers:H,body:JSON.stringify(items)});
      document.getElementById('okno').textContent="#"+(order.order_no??"—");
      document.getElementById('ok').classList.add('show');
    }catch(e){
      toast("Could not send — try again");
      btn.disabled=false;btn.textContent="Place Order";
    }
  }

  function reset(){cart={};bar();document.getElementById('ok').classList.remove('show');
    document.getElementById('place').textContent="Place Order";
    document.querySelectorAll('.item .ctrl').forEach((el,i)=>{});loadMenu();window.scrollTo(0,0);}

  loadMenu();bar();
</script>
</body>
</html>
